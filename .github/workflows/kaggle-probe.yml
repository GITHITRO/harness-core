name: kaggle-probe
on:
  workflow_dispatch: {}   # manual only
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Probe
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          pip install -q kaggle six
          echo "secrets present: username=$([ -n "$KAGGLE_USERNAME" ] && echo y || echo n) key=$([ -n "$KAGGLE_KEY" ] && echo y || echo n) token=$([ -n "$KAGGLE_API_TOKEN" ] && echo y || echo n)" | tee secrets.txt
          # Accept any pasted form without printing it: kaggle.json content, "KAGGLE_API_TOKEN = ...", or the bare token.
          mkdir -p ~/.kaggle && chmod 700 ~/.kaggle
          RAW="$KAGGLE_API_TOKEN"; unset KAGGLE_API_TOKEN
          if [ -n "$KAGGLE_USERNAME" ] && [ -n "$KAGGLE_KEY" ]; then FMT=username+key
          elif printf '%s' "$RAW" | grep -q '"key"'; then
            printf '%s' "$RAW" > ~/.kaggle/kaggle.json; chmod 600 ~/.kaggle/kaggle.json; FMT=kaggle.json
          elif [ -n "$KAGGLE_USERNAME" ] && printf '%s' "$RAW" | tr -d '[:space:]' | grep -Eq '^[0-9a-f]{32}$'; then
            export KAGGLE_KEY=$(printf '%s' "$RAW" | tr -d '[:space:]'); echo "::add-mask::$KAGGLE_KEY"; FMT=legacy-key+username
          elif [ -n "$RAW" ]; then
            TOK=$(printf '%s' "$RAW" | sed -E 's/^[[:space:]]*KAGGLE_API_TOKEN[[:space:]]*=[[:space:]]*//' | tr -d '[:space:]"')
            echo "::add-mask::$TOK"; printf '%s' "$TOK" > ~/.kaggle/access_token; chmod 600 ~/.kaggle/access_token
            export KAGGLE_API_TOKEN="$TOK"; FMT="token(len=${#TOK},prefix=${TOK:0:5})"
          else FMT=none; fi
          echo "credential format: $FMT" | tee -a secrets.txt
          python3 -I stand/kaggle/probe.py
          cat secrets.txt >> probe.md
      - name: Publish
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir pub && cp probe.md pub/ 2>/dev/null || echo "probe failed" > pub/probe.md
          cd pub && git init -q -b kaggle-probe && git config user.name harness-stand && git config user.email harness-stand@users.noreply.github.com
          git add -A && git commit -qm probe
          AUTH="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          git -c http.extraheader="$AUTH" push -q -f "https://github.com/${GITHUB_REPOSITORY}.git" HEAD:kaggle-probe
