name: lane-tau2
# tau2-bench (telecom / banking_knowledge), paired base/harness. Hourly; each run continues where the last one stopped.
on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: [stand/plan.json, .github/workflows/tau2.yml]
concurrency:
  group: lane-tau2
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with: {path: code, persist-credentials: false}
      - name: Read plan
        id: plan
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json; p = json.load(open("code/stand/plan.json")); s = p["tau2"]
          print(f"enabled={str(s['enabled']).lower()}"); print(f"stage={s['stage']}"); print(f"n={s['n']}")
          print(f"arms={s['arms']}"); print(f"budget={s['budget']}"); print(f"model={p['model']}"); print(f"domain={s['domain']}")
          EOF
      - name: State branch
        if: steps.plan.outputs.enabled == 'true'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          AUTH="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          git -c http.extraheader="$AUTH" clone -q --depth 1 --branch runs-tau2 "https://github.com/${GITHUB_REPOSITORY}.git" state 2>/dev/null || \
            (mkdir state && cd state && git init -q -b runs-tau2)
          mkdir -p "state/${{ steps.plan.outputs.stage }}"
          python3 -c "import json;print(json.load(open('state/${{ steps.plan.outputs.stage }}/status.json'))['remaining'])" \
            > "$RUNNER_TEMP/remaining_before" 2>/dev/null || echo 999999 > "$RUNNER_TEMP/remaining_before"
      - uses: actions/setup-python@v5
        if: steps.plan.outputs.enabled == 'true'
        with: {python-version: "3.12"}
      - name: Install tau2-bench v1.0.1 (fc0055d)
        if: steps.plan.outputs.enabled == 'true'
        run: |
          git init -q tau2 && cd tau2
          git fetch -q --depth 1 https://github.com/sierra-research/tau2-bench.git fc0055dc4e0a316c3f83133267fbd6faaa770992
          git checkout -q FETCH_HEAD
          pip install -q uv && uv venv -q .venv --python 3.12 && uv pip install -q --python .venv/bin/python -e .
      - name: Run
        if: steps.plan.outputs.enabled == 'true'
        env:
          KILO_API_KEY: ${{ secrets.KILO_API_KEY }}
        run: |
          STAGE="${{ steps.plan.outputs.stage }}"; RUN_ID="$(date -u +%Y%m%dT%H%M%SZ)"
          OUT="$GITHUB_WORKSPACE/state/$STAGE"; LOGS="$OUT/logs/$RUN_ID"; mkdir -p "$LOGS"
          KEYF="$RUNNER_TEMP/k"; printf '%s' "$KILO_API_KEY" > "$KEYF"; chmod 600 "$KEYF"; unset KILO_API_KEY
          UPSTREAM_KEY_FILE="$KEYF" BUDGET="${{ steps.plan.outputs.budget }}" STATE_FILE="$OUT/pacer_state.json" \
            LOG_DIR="$LOGS" LANE=kilo-tau2 nohup python3 -I code/stand/pacer.py > "$LOGS/pacer.out" 2>&1 &
          sleep 3; rm -f "$KEYF"; curl -sf 127.0.0.1:8787/stats > /dev/null
          export TAU2_DATA_DIR="$GITHUB_WORKSPACE/tau2/data" MODEL="${{ steps.plan.outputs.model }}"
          DEADLINE=$(( $(date +%s) + 35*60 ))
          ( cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE/tau2/.venv/bin/python" -I "$GITHUB_WORKSPACE/code/stand/tau2/run_chunk.py" \
              --domain "${{ steps.plan.outputs.domain }}" --arms "${{ steps.plan.outputs.arms }}" --n "${{ steps.plan.outputs.n }}" \
              --out "$OUT" --deadline "$DEADLINE" --timeout 1800 ) 2>&1 | tee "$LOGS/run.out" || true
          curl -s 127.0.0.1:8787/stats > "$LOGS/pacer_stats.json" || true
          pkill -f stand/pacer.py || true; sleep 1
          gzip -9 "$LOGS"/*.jsonl 2>/dev/null || true
      - name: Commit state
        if: always() && steps.plan.outputs.enabled == 'true'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd state
          git config user.name "harness-stand"; git config user.email "harness-stand@users.noreply.github.com"
          git add -A && git commit -qm "tau2: run ${GITHUB_RUN_ID}" || exit 0
          AUTH="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          git -c http.extraheader="$AUTH" push -q "https://github.com/${GITHUB_REPOSITORY}.git" HEAD:runs-tau2
      - name: Chain next run (only if work remains and this run made progress)
        if: always() && steps.plan.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BEFORE=$(cat "$RUNNER_TEMP/remaining_before")
          AFTER=$(python3 -c "import json;print(json.load(open('state/${{ steps.plan.outputs.stage }}/status.json'))['remaining'])" 2>/dev/null || echo 0)
          echo "remaining before=$BEFORE after=$AFTER"
          if [ "$AFTER" -gt 0 ] && [ "$AFTER" -lt "$BEFORE" ]; then
            gh workflow run tau2.yml --ref main -R "$GITHUB_REPOSITORY" && echo "next run dispatched"
          else
            echo "no chaining"
          fi
