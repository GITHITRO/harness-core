name: lane-sb
# SpreadsheetBench Verified-400, paired base/harness. Hourly; each run continues where the last one stopped.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: [stand/plan.json, .github/workflows/sb.yml]
concurrency:
  group: lane-sb
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with: {path: code, persist-credentials: false}
      - name: Read plan (active stage = first unfinished stage of the queue)
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -I code/stand/active.py sb | tee -a "$GITHUB_OUTPUT"
      - name: State branch
        if: steps.plan.outputs.enabled == 'true'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          AUTH="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          git -c http.extraheader="$AUTH" clone -q --depth 1 --branch runs-sb "https://github.com/${GITHUB_REPOSITORY}.git" state 2>/dev/null || \
            (mkdir state && cd state && git init -q -b runs-sb)
          mkdir -p "state/${{ steps.plan.outputs.stage }}"
          python3 -c "import json;print(json.load(open('state/${{ steps.plan.outputs.stage }}/status.json'))['remaining'])" \
            > "$RUNNER_TEMP/remaining_before" 2>/dev/null || echo 999999 > "$RUNNER_TEMP/remaining_before"
          (cat "state/${{ steps.plan.outputs.stage }}"/results*.jsonl 2>/dev/null | wc -l) > "$RUNNER_TEMP/rows_before"
      - uses: actions/setup-python@v5
        if: steps.plan.outputs.enabled == 'true'
        with: {python-version: "3.12"}
      - name: Cache LibreOffice packages
        if: steps.plan.outputs.enabled == 'true'
        uses: actions/cache@v4
        with: {path: ~/aptcache, key: lo-ubuntu-24.04-v1}
      - name: Install (LibreOffice, SpreadsheetBench @49b73a9, Verified-400)
        if: steps.plan.outputs.enabled == 'true'
        run: |
          # apt took 37 s on some runs and 37-41 min on others (slow mirror / dpkg lock): bound every wait, cache debs.
          t0=$(date +%s); mkdir -p ~/aptcache/partial
          APT="-o Acquire::http::Timeout=20 -o Acquire::Retries=2 -o DPkg::Lock::Timeout=120"
          sudo timeout 300 apt-get $APT update -qq || echo "::warning::apt update slow or failed, continuing with existing lists"
          sudo timeout 900 apt-get $APT -o Dir::Cache::archives="$HOME/aptcache" install -y -qq libreoffice-calc-nogui > /dev/null
          sudo chown -R "$USER" ~/aptcache; rm -f ~/aptcache/lock
          echo "libreoffice install took $(( $(date +%s) - t0 )) s"; soffice --version | head -1
          pip install -q openpyxl numpy tqdm
          git init -q sbrepo && cd sbrepo
          git fetch -q --depth 1 https://github.com/RUCKBReasoning/SpreadsheetBench.git 49b73a94775fb489063f60ca1865e3a650079a79
          git checkout -q FETCH_HEAD
          mkdir -p ../sbdata && tar -xzf data/spreadsheetbench_verified_400.tar.gz -C ../sbdata
      - name: Run
        if: steps.plan.outputs.enabled == 'true'
        env:
          KILO_API_KEY: ${{ secrets.KILO_API_KEY }}
        run: |
          STAGE="${{ steps.plan.outputs.stage }}"; RUN_ID="$(date -u +%Y%m%dT%H%M%SZ)"
          OUT="$GITHUB_WORKSPACE/state/$STAGE"; LOGS="$OUT/logs/$RUN_ID"; mkdir -p "$LOGS"
          KEYF="$RUNNER_TEMP/k"; printf '%s' "$KILO_API_KEY" > "$KEYF"; chmod 600 "$KEYF"; unset KILO_API_KEY
          UPSTREAM_KEY_FILE="$KEYF" BUDGET="${{ steps.plan.outputs.budget }}" STATE_FILE="$OUT/pacer_state.json" \
            LOG_DIR="$LOGS" LANE=kilo-sb nohup python3 -I code/stand/pacer.py > "$LOGS/pacer.out" 2>&1 &
          sleep 3; rm -f "$KEYF"; curl -sf 127.0.0.1:8787/stats > /dev/null
          export SB_DATA="$GITHUB_WORKSPACE/sbdata/spreadsheetbench_verified_400" SB_REPO="$GITHUB_WORKSPACE/sbrepo"
          export MODEL="${{ steps.plan.outputs.model }}"
          DEADLINE=$(( $(date +%s) + 50*60 ))
          ( cd "$RUNNER_TEMP" && python3 -I "$GITHUB_WORKSPACE/code/stand/sb/${{ steps.plan.outputs.script }}.py" --arms "${{ steps.plan.outputs.arms }}" \
              --n "${{ steps.plan.outputs.n }}" --out "$OUT" --deadline "$DEADLINE" ) 2>&1 | tee "$LOGS/run.out" || true
          curl -s 127.0.0.1:8787/stats > "$LOGS/pacer_stats.json" || true
          pkill -f stand/pacer.py || true; sleep 1
          gzip -9 "$LOGS"/*.jsonl 2>/dev/null || true
      - name: Commit state
        if: always() && steps.plan.outputs.enabled == 'true'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd state
          git config user.name "harness-stand"; git config user.email "harness-stand@users.noreply.github.com"
          git add -A && git commit -qm "sb: run ${GITHUB_RUN_ID}" || exit 0
          AUTH="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          git -c http.extraheader="$AUTH" push -q "https://github.com/${GITHUB_REPOSITORY}.git" HEAD:runs-sb
      - name: Chain next run (only if work remains and this run made progress)
        if: always() && steps.plan.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BEFORE=$(cat "$RUNNER_TEMP/remaining_before")
          AFTER=$(python3 -c "import json;print(json.load(open('state/${{ steps.plan.outputs.stage }}/status.json'))['remaining'])" 2>/dev/null || echo unknown)
          ROWS_BEFORE=$(cat "$RUNNER_TEMP/rows_before"); ROWS_AFTER=$(cat "state/${{ steps.plan.outputs.stage }}"/results*.jsonl 2>/dev/null | wc -l)
          echo "remaining before=$BEFORE after=$AFTER rows before=$ROWS_BEFORE after=$ROWS_AFTER"
          HAS=$(GH_TOKEN="$GH_TOKEN" python3 -I code/stand/active.py sb --has-work)
          echo "lane has work: $HAS"
          if [ "$ROWS_AFTER" -gt "$ROWS_BEFORE" ] && [ "$HAS" = 1 ]; then
            gh workflow run sb.yml --ref main -R "$GITHUB_REPOSITORY" && echo "next run dispatched"
          else
            echo "no chaining"
          fi
      - name: Status page + restart an idle lane (no LLM)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p status && cd status && git init -q -b status
          LANE=sb python3 -I ../code/stand/check.py --out STATUS.md --dispatch | head -8
          git config user.name "harness-stand"; git config user.email "harness-stand@users.noreply.github.com"
          git add STATUS.md && git commit -qm "status ${GITHUB_RUN_ID}"
          AUTH="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.extraheader="$AUTH" push -q -f "https://github.com/${GITHUB_REPOSITORY}.git" HEAD:status
